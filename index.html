<!doctype html>
<html lang="de"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff0f6"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Momo ❤️">
<title>Momo ❤️</title><link rel="icon" type="image/svg+xml" href="momo-icon.svg"><link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(160deg,#fff0f6,#fff 55%,#fff6fa);color:#342a30;min-height:100vh}main{max-width:480px;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 15px calc(30px + env(safe-area-inset-bottom))}header{text-align:center;margin-bottom:18px}.logo{width:92px;height:92px;border-radius:24px;display:block;margin:0 auto 10px;box-shadow:0 10px 28px rgba(110,65,80,.13)}h1{margin:3px 0;font-size:27px}header p{margin:5px 0;color:#8a737e;font-size:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.cat{border:1px solid #f0d9e3;background:rgba(255,255,255,.94);border-radius:19px;padding:14px 11px;min-height:91px;text-align:left;color:#342a30;box-shadow:0 6px 18px rgba(110,60,80,.05);font:inherit}.cat:active{transform:scale(.97)}.cat .ico{display:block;font-size:27px;margin-bottom:6px}.cat b{font-size:14px}.sheet{display:none;position:fixed;inset:0;background:rgba(50,35,42,.26);z-index:20;align-items:flex-end;justify-content:center}.sheet.open{display:flex}.panel{background:#fff9fb;width:100%;max-width:480px;max-height:82vh;overflow:auto;border-radius:28px 28px 0 0;padding:12px 15px calc(20px + env(safe-area-inset-bottom));box-shadow:0 -10px 35px rgba(70,35,50,.14)}.handle{width:42px;height:5px;border-radius:5px;background:#dbcbd2;margin:0 auto 13px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.top h2{font-size:22px;margin:0}.close{border:0;background:#f4e8ed;border-radius:50%;width:34px;height:34px;font-size:19px}.option{display:block;text-decoration:none;color:#342a30;background:#fff;border:1px solid #efdde5;border-radius:16px;padding:13px;margin:9px 0;box-shadow:0 4px 12px rgba(90,45,65,.035)}.option strong{display:block;font-size:14px;color:#c05478;margin-bottom:4px}.option span{font-size:14px;line-height:1.35}.info{text-align:center;color:#927d87;font-size:12px;line-height:1.4;margin-top:17px}
</style></head><body><main>
<header><img class="logo" src="momo-icon.svg" alt="Momo Nachrichten"><h1>Nachricht an Momo</h1><p>Kategorie wählen → Nachricht auswählen → WhatsApp</p></header>
<div class="grid" id="cats"></div>
<div class="info">WhatsApp öffnet die ausgewählte Nachricht zuerst zur Kontrolle. Es wird nichts automatisch versendet.</div>
</main>
<div class="sheet" id="sheet" onclick="if(event.target===this)closeSheet()"><div class="panel"><div class="handle"></div><div class="top"><h2 id="title"></h2><button class="close" onclick="closeSheet()">×</button></div><div id="options"></div></div></div>
<script>
const phone="16027258786";
const data=[
["☀️","Guten Morgen",[
["Kurz","Guten Morgen Momo ❤️ Hab einen wunderschönen Tag! 😘"],
["Normal","Guten Morgen Momo ❤️ Wir wünschen dir einen wunderschönen Tag. Hab dich lieb und denk an dich 😘"],
["Lang","Guten Morgen mein Schatz ❤️ Wir wünschen dir einen richtig schönen Tag mit vielen guten Momenten. Genieß deinen Tag, pass gut auf dich auf und denk daran: Wir denken an dich und haben dich ganz fest lieb 😘☀️"],
["Motivation","Guten Morgen Momo ☀️❤️ Du schaffst heute alles, was du dir vornimmst. Geh mit einem Lächeln in den Tag – wir glauben an dich! 💪😘"],
["Lustig","Guten Morgen Schlafmütze 😴☀️ Jetzt raus aus den Federn und die Welt erobern 😘❤️"]]],
["🤗","Wir denken an dich",[
["Kurz","Wir denken an dich ❤️😘"],["Normal","Wir denken gerade an dich und schicken dir eine feste Umarmung 🤗❤️"],["Lang","Nur eine kleine Nachricht zwischendurch, damit du weißt, dass wir gerade ganz fest an dich denken. Auch wenn wir nicht bei dir sind, bist du immer bei uns ❤️ Fühl dich ganz fest gedrückt 😘🤗"],["Vermissen","Du fehlst uns gerade ganz besonders ❤️ Wir würden dich jetzt am liebsten einmal ganz fest drücken 🤗😘"],["Lustig","Kurze Durchsage aus der Heimat: Hier denkt gerade jemand SEHR an dich 😄❤️"]]],
["🩰","Ballett",[
["Kurz","Viel Spaß beim Ballett heute 🩰❤️"],["Normal","Viel Spaß beim Training heute, Momo 🩰❤️ Genieß es und hab eine schöne Zeit!"],["Lang","Wir wünschen dir ganz viel Freude beim Training heute 🩰❤️ Genieß jede Minute, hab Spaß und mach einfach dein Ding. Wir denken an dich und sind stolz auf deinen Einsatz 😘"],["Motivation","Viel Kraft und Freude fürs Training 🩰💪❤️ Konzentrier dich auf dich, genieß die Musik und zeig, was in dir steckt!"],["Danach","Training geschafft? 🩰❤️ Hoffentlich war es schön! Jetzt Beine hoch und ein bisschen erholen 😘"]]],
["🏫","Schule",[
["Kurz","Wie war die Schule heute? 😊❤️"],["Normal","Hallo Momo ❤️ Wie war dein Schultag heute? Erzähl uns später, wie es dir gegangen ist 😊"],["Lang","Wie war die Schule heute, Momo? ❤️ Wir hoffen, du hattest einen guten Tag, hast wieder ein bisschen mehr Italienisch aufgeschnappt und konntest auch zwischendurch lachen 😊😘"],["Motivation","Viel Erfolg heute in der Schule 📚❤️ Eins nach dem anderen – du machst das großartig!"],["Lustig","Schule überlebt? 😄📚❤️ Bericht bitte später an Mama & Papa!"]]],
["🍝","Essen",[
["Kurz","Schon etwas Gutes gegessen? 😋❤️"],["Normal","Hast du heute schon etwas Gutes gegessen? 🍝❤️ Lass es dir schmecken!"],["Lang","Kleine Mama-und-Papa-Kontrolle 😄❤️ Hast du heute genug gegessen und getrunken? Bei deinem langen Tag und dem vielen Training brauchst du ordentlich Energie 🍝😘"],["Italien","Was gibt’s heute Gutes in Italien? 🇮🇹🍝😋 Schick uns ein Foto!"],["Lustig","Wichtige Frage des Tages: Pasta, Pizza oder etwas ganz anderes? 😄🍕🍝❤️"]]],
["📞","Telefonieren",[
["Kurz","Ruf uns an, wenn du Zeit hast ❤️"],["Normal","Wenn du später ein paar Minuten Zeit hast, ruf uns kurz an ❤️😘 Wir würden uns freuen, dich zu hören."],["Lang","Wenn dein Tag etwas ruhiger wird und du ein paar Minuten Zeit hast, würden wir uns sehr freuen, deine Stimme zu hören ❤️ Kein Stress – ruf einfach an, wenn es für dich passt 😘"],["Nur kurz","Hast du 2 Minuten für einen Mini-Anruf? 📞❤️"],["Video","Hast du später Lust auf einen kurzen Videoanruf? 📱🥰"]]],
["🥰","Hab dich lieb",[
["Kurz","Hab dich lieb ❤️"],["Normal","Nur eine kleine Nachricht zwischendurch: Wir haben dich ganz fest lieb ❤️🥰"],["Lang","Manchmal braucht es gar keinen besonderen Grund für eine Nachricht: Wir wollten dir einfach sagen, dass wir dich unendlich lieb haben und sehr stolz auf dich sind ❤️🥰😘"],["Mama & Papa","Ganz viele Bussis von Mama & Papa ❤️😘😘 Wir haben dich lieb!"],["Extra","Nur für dich: ❤️❤️❤️ + eine riesengroße Umarmung von uns 🤗"]]],
["🌙","Gute Nacht",[
["Kurz","Gute Nacht Momo ❤️🌙"],["Normal","Gute Nacht Momo ❤️ Schlaf gut und träum schön 😘🌙"],["Lang","Gute Nacht mein Schatz ❤️ Jetzt kannst du den langen Tag hinter dir lassen. Schlaf gut, erhol dich und träum etwas Schönes. Wir denken an dich und schicken dir einen dicken Gute-Nacht-Kuss 😘🌙"],["Nach Training","Jetzt gut ausruhen nach deinem langen Tag und Training 🩰🌙❤️ Schlaf gut, Momo 😘"],["Mama & Papa","Gute Nacht von Mama & Papa ❤️ Wir drücken dich aus der Ferne ganz fest. Schlaf gut und bis morgen 😘🌙"]]]
];
const cats=document.getElementById("cats"),sheet=document.getElementById("sheet"),opts=document.getElementById("options"),title=document.getElementById("title");
data.forEach((c,i)=>{let b=document.createElement("button");b.className="cat";b.innerHTML='<span class="ico">'+c[0]+'</span><b>'+c[1]+'</b>';b.onclick=()=>openCat(i);cats.appendChild(b)});
function openCat(i){const c=data[i];title.textContent=c[0]+" "+c[1];opts.innerHTML="";c[2].forEach(o=>{let a=document.createElement("a");a.className="option";a.href="https://wa.me/"+phone+"?text="+encodeURIComponent(o[1]);a.innerHTML="<strong>"+o[0]+"</strong><span>"+o[1]+"</span>";opts.appendChild(a)});sheet.classList.add("open")}
function closeSheet(){sheet.classList.remove("open")}
</script></body></html>
